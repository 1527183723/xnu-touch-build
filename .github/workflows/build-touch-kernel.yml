name: build-haotian-touch-kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and helpers
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make coreutils || true
          mkdir -p "$RUNNER_TEMP/bin"
          echo '#!/bin/sh' > "$RUNNER_TEMP/bin/nproc"
          echo 'sysctl -n hw.ncpu' >> "$RUNNER_TEMP/bin/nproc"
          chmod +x "$RUNNER_TEMP/bin/nproc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /usr/bin/make --version | head -1

      - name: Fetch XNU and superboyyy touch layer
        run: |
          cd xnu26
          DADA_NATIVE_TOUCH=superboyyy bash apply.sh

      - name: Show patched touch driver
        run: |
          F=xnu-src/xnu-12377.121.6/bsd/dev/hakios_dada_touch.c
          ls -la "$F"
          grep -n 'PIN_MISO' "$F" | head -3
          grep -n 'SE_PHYS' "$F" | head -3
          grep -n 'haotian' "$F" | head -4

      - name: Dependencies
        run: |
          cd xnu26
          bash deps-macos.sh

      - name: Build kernel
        env:
          MAKE: /usr/bin/make
        run: |
          cd xnu26
          bash build-macos.sh

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p artifact
          find xnu-src -type f -name 'kernel*' -size +1M -print -exec cp -v {} artifact/ \; || true
          ls -la artifact || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haotian-touch-kernel
          path: artifact/**
          if-no-files-found: warn
