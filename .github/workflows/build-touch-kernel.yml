name: build-haotian-touch-kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and helpers
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make coreutils || true
          mkdir -p "$RUNNER_TEMP/bin"
          echo '#!/bin/sh' > "$RUNNER_TEMP/bin/nproc"
          echo 'sysctl -n hw.ncpu' >> "$RUNNER_TEMP/bin/nproc"
          chmod +x "$RUNNER_TEMP/bin/nproc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /usr/bin/make --version | head -1

      - name: Select the newest Xcode available
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fetch XNU and superboyyy touch layer
        run: |
          cd xnu26
          DADA_NATIVE_TOUCH=superboyyy bash apply.sh

      - name: Show patched touch driver
        run: |
          F=xnu-src/xnu-12377.121.6/bsd/dev/hakios_dada_touch.c
          ls -la "$F"
          grep -n 'PIN_MISO' "$F" | head -3
          grep -n 'SE_PHYS' "$F" | head -3
          grep -n 'haotian' "$F" | head -4

      - name: Dependencies
        run: |
          cd xnu26
          bash deps-macos.sh

      - name: Export headers (needed by deps stage 2)
        env:
          MAKE: /usr/bin/make
        run: |
          cd xnu26
          bash build-macos.sh exporthdrs installhdrs

      - name: Seed TargetConditionals.h for stage 2
        run: |
          mkdir -p xnu-deps/build/pthread/inc
          S1="$(xcrun --sdk macosx --show-sdk-path)/usr/include/TargetConditionals.h"
          S2="$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/TargetConditionals.h"
          cp "$S1" xnu-deps/build/pthread/inc/ 2>/dev/null || cp "$S2" xnu-deps/build/pthread/inc/
          ls -la xnu-deps/build/pthread/inc/

      - name: Dependencies stage 2 (libfirehose_kernel, libpthread_kext)
        run: |
          cd xnu26
          bash deps-macos.sh

      - name: Build kernel
        env:
          MAKE: /usr/bin/make
        run: |
          cd xnu26
          bash build-macos.sh

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p artifact
          set -x
          ls -la xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/ || true
          cp -v xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837 artifact/mach.development.bcm2837 || true
          find xnu-src -type f -name 'mach.development.bcm2837' -size +5M -exec cp -v {} artifact/ \; || true
          set +x
          ls -la artifact

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mach-kernel
          path: artifact/**
          if-no-files-found: warn
